<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 64px; padding: 0 96px; box-sizing: border-box;
    background: #075985; color: #ffffff; font-family: "Malgun Gothic", system-ui, sans-serif;
  }
  img { width: 300px; height: 300px; border-radius: 56px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); border: 6px solid rgba(255, 255, 255, 0.25); }
  h1 { margin: 0; font-size: 104px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; }
  p { margin: 26px 0 0; font-size: 46px; font-weight: 700; line-height: 1.35; }
  .tap { display: inline-block; margin-top: 34px; padding: 14px 30px; border-radius: 999px; background: #ffffff; color: #075985; font-size: 40px; font-weight: 900; }
</style>
</head>
<body>
  <img src="../../public/icons/qr-pay-512.png" alt="">
  <div>
    <h1>행사 QR 송금</h1>
    <p>계좌이체를 QR로 받는 앱</p>
    <span class="tap">눌러서 휴대폰에 설치</span>
  </div>
</body>
</html>
