<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="theme-color" content="#075985" />
    <meta name="description" content="행사 판매자를 위한 간편 계좌 송금 QR 만들기" />
    <!-- KakaoTalk link preview. VITE_SITE_URL is the Pages URL set by the deploy workflow. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="행사 QR 송금" />
    <meta property="og:description" content="눌러서 휴대폰에 설치하세요. 행사장에서 계좌이체를 QR로 받는 앱이에요." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%icons/qr-pay-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/qr-pay-192.png" />
    <link rel="apple-touch-icon" href="./icons/qr-pay-192.png" />
    <title>행사 QR 송금</title>
  </head>
  <body>
    <main data-seller-app aria-live="polite"></main>
    <script type="module" src="/src/seller/main.ts"></script>
  </body>
</html>
